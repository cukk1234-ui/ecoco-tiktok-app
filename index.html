    <p class="eyebrow">Ecoco 台灣團隊</p>
    <h1>Ecoco 本機短影音發布器</h1>
    <p class="lead">將 Ecoco 自有繁體商品影片安全地排程與發布至官方 TikTok 帳號。</p>

    <h2>運作方式</h2>
    <ol>
      <li>授權管理者透過 TikTok Login Kit 登入。</li>
      <li>工具查詢帳號可用的隱私與互動選項。</li>
      <li>管理者選擇自有影片並確認標題、揭露與發布設定。</li>
      <li>工具以 TikTok Content Posting API 上傳並查詢結果。</li>
    </ol>

    <p>授權 Token 只保存在管理者 Mac 的 macOS Keychain。本工具不讀取瀏覽器 Cookie、不保存 TikTok 密碼，也不繞過平台安全驗證。</p>

    <p class="footer"><a href="tiktok-terms.html">服務條款</a> · <a href="tiktok-privacy-policy.html">隱私政策</a></p>
  </main>
